services:
  booking-service:
    build: .
    container_name: cinema_booking_app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=10.10.3.2
      - REDIS_HOST=10.10.3.3
      - RABBITMQ_HOST=10.10.3.4
    networks:
      internal_net:
        ipv4_address: 10.10.2.2
      data_net:
        ipv4_address: 10.10.3.5
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s